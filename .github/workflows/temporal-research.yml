name: Temporal drift research (manual)
on:
  workflow_dispatch:
    inputs:
      include_posthoc_test:
        description: 'Run retrospective test-period replay (not untouched holdout)'
        required: true
        type: boolean
        default: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Check methodology tests
        run: python -m pytest -q
      - name: Reproduce original data and model outputs
        run: python -m fraudgraph.pipeline --download
      - name: Run drift diagnostics and validation-only model search
        run: python scripts/run_temporal_research.py
      - name: Optional post-hoc replay (already-inspected period)
        if: inputs.include_posthoc_test
        run: python scripts/run_temporal_research.py --include-posthoc-test
      - name: Upload exploratory reports (no raw data or model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fraudgraph-temporal-study
          path: reports/exploratory/
          retention-days: 14
          if-no-files-found: warn
