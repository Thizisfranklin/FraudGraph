name: Robustness and analyst research (manual)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_posthoc_test:
        description: 'Include exploratory replay on already-inspected test steps'
        required: true
        type: boolean
        default: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Test methodology and temporal leakage guards
        run: python -m pytest -q
      - name: Reproduce original historical predictions
        run: python -m fraudgraph.pipeline --download
      - name: Generate existing drift diagnostics (validation only)
        run: python scripts/run_temporal_research.py
      - name: Run prespecified regularization and label-delay scenarios
        if: ${{ ! inputs.include_posthoc_test }}
        run: python scripts/run_robustness_research.py --label-lags 2 4 6
      - name: Optional post-hoc test replay — NOT a fresh holdout
        if: inputs.include_posthoc_test
        run: python scripts/run_robustness_research.py --label-lags 2 4 6 --include-posthoc-test
      - name: Build analyst-facing offline HTML research dashboard
        run: python scripts/build_research_dashboard.py
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fraudgraph-robustness-and-analyst-report
          path: reports/exploratory/
          retention-days: 30
          if-no-files-found: warn
