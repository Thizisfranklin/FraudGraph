name: Investigator React app - build and deploy
on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/investigator-web.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/investigator-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install React application dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Build production-ready application
        working-directory: app
        run: npm run build
      - name: Upload app build
        uses: actions/upload-artifact@v4
        with:
          name: fraudgraph-investigator-app-build
          path: app/dist/
          retention-days: 30
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fraudgraph-investigator-app-build
          path: site
      - name: Check whether the repository owner has enabled GitHub Pages
        id: pages-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > /tmp/fraudgraph-pages.json 2>/dev/null; then
            BUILD_TYPE=$(python -c "import json; print(json.load(open('/tmp/fraudgraph-pages.json')).get('build_type', ''))")
            if [ "$BUILD_TYPE" = "workflow" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::notice::React application built successfully, but GitHub Pages has not been enabled. Repository owner: Settings > Pages > Source: GitHub Actions; then rerun this workflow."
      - if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deploy
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
