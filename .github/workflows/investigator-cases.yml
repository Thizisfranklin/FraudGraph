name: Build real Investigator case data
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Run methodology and exporter tests
        run: python -m pytest -q
      - name: Reproduce historical dataset and saved model scores
        run: python -m fraudgraph.pipeline --download
      - name: Export real case sample and directed graph evidence
        run: python scripts/export_investigator_samples.py
      - name: Upload source-backed case data
        uses: actions/upload-artifact@v4
        with:
          name: fraudgraph-investigator-cases
          path: app/public/investigations.json
          retention-days: 30
          if-no-files-found: error
